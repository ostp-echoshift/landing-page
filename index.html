  // --------------------------------------------------------------
  // CANVAS DE FONDO (RADAR)
  // --------------------------------------------------------------
  function resizeCanvas() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawRadarBackground();
  }

  function drawRadarBackground() {
    if (!ctx) return;
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const maxR = Math.min(w, h) * 0.42;
    ctx.clearRect(0, 0, w, h);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    grad.addColorStop(0, '#050508');
    grad.addColorStop(1, '#020205');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    const rings = [maxR * 0.25, maxR * 0.5, maxR * 0.75, maxR * 0.92];
    rings.forEach((r, idx) => {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 240, 255, ${idx === 2 ? 0.12 : 0.06})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    });
    const spokes = 24;
    for (let i = 0; i < spokes; i++) {
      const angle = (i / spokes) * Math.PI * 2;
      const x2 = cx + Math.cos(angle) * maxR;
      const y2 = cy + Math.sin(angle) * maxR;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.02)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
  }

  function animateRadarPulse() {
    if (!ctx) return;
    function pulse() {
      drawRadarBackground();
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const maxR = Math.min(w, h) * 0.42;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const pulseAngle = (performance.now() / 4200) % (Math.PI * 2);
      const sweepStart = pulseAngle - 0.35;
      const sweepEnd = pulseAngle;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, maxR * 0.98, sweepStart, sweepEnd);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.03)';
      ctx.fill();
      ctx.restore();
      animationFrame = requestAnimationFrame(pulse);
    }
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(pulse);
  }

  // --------------------------------------------------------------
  // NODOS RADIALES (centrados)
  // --------------------------------------------------------------
  function getNodeRadius() {
    return Math.min(window.innerWidth, window.innerHeight) * 0.28;
  }

  function rebuildRadialPositions() {
    const radius = getNodeRadius();
    const midRadius = radius * 0.55;
    DIMENSIONS.forEach((dim, idx) => {
      const angleDeg = -90 + idx * 45;
      const angleRad = angleDeg * Math.PI / 180;
      const endX = Math.cos(angleRad) * radius;
      const endY = Math.sin(angleRad) * radius;
      const midX = Math.cos(angleRad) * midRadius;
      const midY = Math.sin(angleRad) * midRadius;
      const group = document.getElementById(`arm-group-${dim.id}`);
      if (!group) return;
      const svgLine = group.querySelector('.arm-svg');
      if (svgLine) {
        const line = svgLine.querySelector('line');
        if (line) {
          line.setAttribute('x2', endX);
          line.setAttribute('y2', endY);
        }
        const dot = svgLine.querySelector('circle');
        if (dot) {
          dot.setAttribute('cx', midX);
          dot.setAttribute('cy', midY);
        }
      }
      const pill = group.querySelector('.node-pill');
      if (pill) {
        pill.style.left = endX + 'px';
        pill.style.top = endY + 'px';
      }
    });
  }

  function buildRadialAntenna() {
    armsWrap.innerHTML = '';
    const radius = getNodeRadius();
    const midRadius = radius * 0.55;

    DIMENSIONS.forEach((dim, idx) => {
      const angleDeg = -90 + idx * 45;
      const angleRad = angleDeg * Math.PI / 180;
      const endX = Math.cos(angleRad) * radius;
      const endY = Math.sin(angleRad) * radius;
      const midX = Math.cos(angleRad) * midRadius;
      const midY = Math.sin(angleRad) * midRadius;

      const group = document.createElement('div');
      group.className = 'arm-group';
      group.id = `arm-group-${dim.id}`;
      group.style.transform = `translate(0px, 0px)`;

      const svgNS = 'http://www.w3.org/2000/svg';
      const svgLine = document.createElementNS(svgNS, 'svg');
      svgLine.classList.add('arm-svg');
      svgLine.style.width = '1px';
      svgLine.style.height = '1px';
      svgLine.style.overflow = 'visible';

      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', '0');
      line.setAttribute('y1', '0');
      line.setAttribute('x2', endX);
      line.setAttribute('y2', endY);
      line.setAttribute('stroke', dim.color);
      line.setAttribute('stroke-width', '1.2');
      line.setAttribute('stroke-dasharray', '4 5');
      line.setAttribute('opacity', '0.5');
      svgLine.appendChild(line);

      const midDot = document.createElementNS(svgNS, 'circle');
      midDot.setAttribute('cx', midX);
      midDot.setAttribute('cy', midY);
      midDot.setAttribute('r', '3');
      midDot.setAttribute('fill', dim.color);
      midDot.setAttribute('opacity', '0.5');
      svgLine.appendChild(midDot);

      group.appendChild(svgLine);

      const pill = document.createElement('div');
      pill.className = 'node-pill';
      pill.style.left = endX + 'px';
      pill.style.top = endY + 'px';
      pill.dataset.index = idx;

      const hex = document.createElement('div');
      hex.className = 'node-hex';
      hex.style.background = `linear-gradient(145deg, ${dim.bg}, rgba(0,0,0,0.7))`;
      hex.style.border = `1px solid ${dim.color}66`;
      const svgIcon = document.createElementNS(svgNS, 'svg');
      svgIcon.setAttribute('viewBox', '0 0 24 24');
      svgIcon.style.width = '30px';
      svgIcon.style.height = '30px';
      svgIcon.style.stroke = dim.color;
      svgIcon.style.fill = 'none';
      svgIcon.innerHTML = ICONS_SVG[idx];
      hex.appendChild(svgIcon);

      const glow = document.createElement('div');
      glow.style.cssText = `position:absolute; inset:0; background: radial-gradient(circle at 50% 40%, ${dim.color}33, transparent 70%); clip-path: polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); pointer-events:none;`;
      hex.appendChild(glow);
      pill.appendChild(hex);

      const labelDiv = document.createElement('div');
      labelDiv.className = 'node-label';
      const numSpan = document.createElement('div');
      numSpan.className = 'lbl-num';
      numSpan.style.color = dim.color;
      numSpan.textContent = `DIM ${dim.id}`;
      const nameSpan = document.createElement('div');
      nameSpan.className = 'lbl-name';
      nameSpan.textContent = dim.short;
      labelDiv.appendChild(numSpan);
      labelDiv.appendChild(nameSpan);
      pill.appendChild(labelDiv);

      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        showDetail(idx);
      });
      pill.addEventListener('mouseenter', () => {
        hex.style.border = `1.5px solid ${dim.color}cc`;
        hex.style.boxShadow = `0 0 14px ${dim.color}80`;
      });
      pill.addEventListener('mouseleave', () => {
        hex.style.border = `1px solid ${dim.color}66`;
        hex.style.boxShadow = 'none';
      });
      group.appendChild(pill);
      armsWrap.appendChild(group);
    });
    window.addEventListener('resize', () => {
      rebuildRadialPositions();
      drawRadarBackground();
    });
  }

  // --------------------------------------------------------------
  // INTERACCIÓN
  // --------------------------------------------------------------
  function toggleAntenna() {
    isOpen = !isOpen;
    hubHint.textContent = isOpen ? '▾ colapsar antena' : '▸ desplegar antena';
    if (!isOpen) closeDetail();

    if (isOpen) {
      hubWrap.classList.add('to-horizon');
      horizonLine.classList.add('visible');
    } else {
      hubWrap.classList.remove('to-horizon');
      horizonLine.classList.remove('visible');
    }

    DIMENSIONS.forEach((dim, i) => {
      const group = document.getElementById(`arm-group-${dim.id}`);
      if (!group) return;
      if (isOpen) {
        setTimeout(() => {
          group.classList.add('active');
        }, i * 70);
      } else {
        group.classList.remove('active');
      }
    });
  }

  function showDetail(index) {
    currentDimIndex = index;
    const dim = DIMENSIONS[index];
    dpBar.style.background = dim.color;
    dpNum.textContent = `DIM ${dim.id}`;
    dpNum.style.color = dim.color;
    dpTitle.textContent = dim.short;
    dpSub.textContent = dim.sub;
    dpExtra.innerHTML = `<span>📟 Código: ${dim.codigo}</span><span>⚡ Re: ${dim.ref}</span>`;
    detailPanel.classList.add('show');
  }

  function closeDetail() {
    detailPanel.classList.remove('show');
    currentDimIndex = null;
  }

  // REDIRECCIÓN CORREGIDA: a service.html
  function exploreCurrentDim() { if (currentDimIndex !== null) { const dimId = DIMENSIONS[currentDimIndex].id; window.location.href = "dim" + dimId + ".html"; } }

  function setupAPI() {
    window.OSTP_API = window.OSTP_API || {};
    window.OSTP_API.submitFunnel = function(payload) {
      const dim = (payload && payload.dim) || new URLSearchParams(window.location.search).get('dim') || '00';
      console.log('[OSTP_API] submitFunnel -> dim', dim);
      // Redirigir a service.html con el parámetro dim
      return Promise.resolve({ status: 'accepted', dim: dim, redirect: `service.html?dim=${dim}` });
    };
  }

  // --------------------------------------------------------------
  // INICIALIZACIÓN
  // --------------------------------------------------------------
  function init() {
    canvas = document.getElementById('radarCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    animateRadarPulse();
    buildRadialAntenna();
    setupAPI();
    hubWrap.addEventListener('click', toggleAntenna);
    dpExploreBtn.addEventListener('click', exploreCurrentDim);
    dpCloseBtn.addEventListener('click', closeDetail);
    window.addEventListener('resize', () => {
      resizeCanvas();
      drawRadarBackground();
    });
    document.addEventListener('click', (e) => {
      if (detailPanel.classList.contains('show') && !detailPanel.contains(e.target) && !e.target.closest('.node-pill')) {
        closeDetail();
      }
    });
  }
  init();
</script>
<script>
    // ===== AMORPHOUS GRAPH (PARTICULAS) =====
    class AmorphousGraph {
      constructor(canvasId, config = {}) {
        this.canvas = document.getElementById(canvasId);
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.config = {
          particleCount: config.particleCount || 50,
          connectionRadius: config.connectionRadius || 140,
          particleRadius: config.particleRadius || 2.5,
          speed: config.speed || 0.4,
          color: config.color || 'rgba(0,240,255,',
          ...config
        };
        this.particles = [];
        this.mouse = { x: null, y: null, radius: 150 };
        this.resize();
        this.init();
        this.animate();
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('mousemove', (e) => this.handleMouse(e));
        window.addEventListener('mouseleave', () => {
          this.mouse.x = null;
          this.mouse.y = null;
        });
      }

      resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (this.canvas.width !== w || this.canvas.height !== h) {
          this.canvas.width = w;
          this.canvas.height = h;
          this.init();
        }
      }

      handleMouse(e) {
        const r = this.canvas.getBoundingClientRect();
        this.mouse.x = e.clientX - r.left;
        this.mouse.y = e.clientY - r.top;
      }

      init() {
        this.particles = [];
        for (let i = 0; i < this.config.particleCount; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height,
            vx: (Math.random() - 0.5) * this.config.speed,
            vy: (Math.random() - 0.5) * this.config.speed,
            radius: Math.random() * 0.8 + this.config.particleRadius * 0.6
          });
        }
      }

      drawParticle(p) {
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = this.config.color + '0.8)';
        this.ctx.fill();
      }

      drawConnection(p1, p2) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < this.config.connectionRadius) {
          this.ctx.beginPath();
          this.ctx.moveTo(p1.x, p1.y);
          this.ctx.lineTo(p2.x, p2.y);
          const o = 1 - dist / this.config.connectionRadius;
          this.ctx.strokeStyle = this.config.color + (o * 0.35) + ')';
          this.ctx.lineWidth = 0.6;
          this.ctx.stroke();
        }
      }

      updateParticle(p) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
        if (this.mouse.x !== null) {
          const dx = p.x - this.mouse.x;
          const dy = p.y - this.mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < this.mouse.radius) {
            const f = (this.mouse.radius - dist) / this.mouse.radius;
            p.vx += dx * f * 0.02;
            p.vy += dy * f * 0.02;
          }
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = 0; i < this.particles.length; i++) {
          for (let j = i + 1; j < this.particles.length; j++) {
            this.drawConnection(this.particles[i], this.particles[j]);
          }
        }
        for (const p of this.particles) {
          this.updateParticle(p);
          this.drawParticle(p);
        }
        requestAnimationFrame(() => this.animate());
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (document.getElementById('amorphous-graph')) {
        new AmorphousGraph('amorphous-graph', {
          particleCount: 50,
          connectionRadius: 140,
          speed: 0.4,
          color: 'rgba(0,240,255,'
        });
      }
    });
</script>

      if (hamburger && mobileNav) {
        hamburger.addEventListener('click', function() {

          mobileNav.classList.toggle('open');

        // Cerrar al hacer clic en un enlace
        mobileNav.querySelectorAll('.nav-link, .nav-cta').forEach(function(link) {

            hamburger.classList.remove('active');
            mobileNav.classList.remove('open');
          });
        });
      }
    });

<!-- template_card_service.html - vars: {{titulo}} {{descripcion}} {{icono}} {{cta}} -->
<div class="card-service">
    <div class="card-icon">{{icono}}</div>
    <h3 class="card-title">{{titulo}}</h3>
    <p class="card-desc">{{descripcion}}</p>
    <a href="#contacto" class="card-cta">{{cta}}</a>
</div>

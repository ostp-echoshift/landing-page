<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
<defs>

  <!-- ── GRADIENTES BASE ── -->
  <radialGradient id="rim_outer" cx="42%" cy="35%" r="58%">
    <stop offset="0%" stop-color="#5a5a5a"/>
    <stop offset="40%" stop-color="#2a2a2a"/>
    <stop offset="100%" stop-color="#111"/>
  </radialGradient>

  <radialGradient id="bg_inner" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#1c1c1c"/>
    <stop offset="70%" stop-color="#0d0d0d"/>
    <stop offset="100%" stop-color="#060606"/>
  </radialGradient>

  <radialGradient id="rim_chrome" cx="40%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#888"/>
    <stop offset="30%" stop-color="#555"/>
    <stop offset="70%" stop-color="#333"/>
    <stop offset="100%" stop-color="#1a1a1a"/>
  </radialGradient>

  <radialGradient id="sphere_chrome" cx="38%" cy="28%" r="62%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="20%" stop-color="#d8d8d8"/>
    <stop offset="55%" stop-color="#888"/>
    <stop offset="80%" stop-color="#444"/>
    <stop offset="100%" stop-color="#1a1a1a"/>
  </radialGradient>

  <linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#cccccc"/>
    <stop offset="30%" stop-color="#ffffff"/>
    <stop offset="60%" stop-color="#aaaaaa"/>
    <stop offset="100%" stop-color="#555"/>
  </linearGradient>

  <linearGradient id="wing_grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#cccccc"/>
    <stop offset="25%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#aaaaaa"/>
    <stop offset="75%" stop-color="#666"/>
    <stop offset="100%" stop-color="#333"/>
  </linearGradient>

  <linearGradient id="wing_grad2" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#999"/>
    <stop offset="40%" stop-color="#dddddd"/>
    <stop offset="100%" stop-color="#444"/>
  </linearGradient>

  <linearGradient id="keel_grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#bbb"/>
    <stop offset="40%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#888"/>
    <stop offset="100%" stop-color="#333"/>
  </linearGradient>

  <linearGradient id="text_grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#aaaaaa"/>
    <stop offset="35%" stop-color="#eeeeee"/>
    <stop offset="60%" stop-color="#888888"/>
    <stop offset="100%" stop-color="#444444"/>
  </linearGradient>

  <linearGradient id="text_sub_grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#777"/>
    <stop offset="50%" stop-color="#aaa"/>
    <stop offset="100%" stop-color="#444"/>
  </linearGradient>

  <!-- ── ANIMACIÓN: barrido de luz sobre alas (izq→der) ── -->
  <linearGradient id="sweep_L" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
      <animate attributeName="offset" values="0;0.85;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
    <stop offset="0%" stop-color="#E8F4FF" stop-opacity="0.55">
      <animate attributeName="offset" values="0.05;0.9;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
      <animate attributeName="offset" values="0.12;1;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
  </linearGradient>

  <linearGradient id="sweep_R" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
      <animate attributeName="offset" values="0;0.85;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
    <stop offset="0%" stop-color="#E8F4FF" stop-opacity="0.55">
      <animate attributeName="offset" values="0.05;0.9;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
      <animate attributeName="offset" values="0.12;1;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </stop>
  </linearGradient>

  <!-- ── FILTROS ── -->
  <filter id="shadow_soft">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
  </filter>
  <filter id="glow_subtle">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="led_glow">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="rim_glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Clip circle para efectos internos -->
  <clipPath id="inner_clip">
    <circle cx="250" cy="250" r="226"/>
  </clipPath>
</defs>

<!-- ═══════════════════════════════════════ -->
<!-- ESTRUCTURA BASE                         -->
<!-- ═══════════════════════════════════════ -->

<!-- Círculo base negro -->
<circle cx="250" cy="250" r="248" fill="#080808"/>

<!-- Rim exterior -->
<circle cx="250" cy="250" r="248" fill="url(#rim_outer)"/>

<!-- Rim cromado animado — pulso azul profundo LED -->
<circle cx="250" cy="250" r="238" fill="none" stroke-width="12">
  <animate attributeName="stroke" 
    values="#444444;#1A4A7A;#2A6AAA;#1A4A7A;#444444;#555555;#444444"
    dur="6s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
</circle>

<!-- Fondo interior -->
<circle cx="250" cy="250" r="228" fill="url(#bg_inner)"/>

<!-- Pulso LED azul profundo sobre fondo — capa sutil -->
<circle cx="250" cy="250" r="220" fill="none" stroke-width="40" opacity="0.06" filter="url(#rim_glow)">
  <animate attributeName="stroke"
    values="#0A2040;#1A4A7A;#0A2040;#061428;#0A2040"
    dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity"
    values="0.04;0.12;0.04;0.02;0.04"
    dur="6s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
</circle>

<!-- Bordes rim decorativos -->
<circle cx="250" cy="250" r="236" fill="none" stroke="#555" stroke-width="1" opacity="0.5"/>
<circle cx="250" cy="250" r="230" fill="none" stroke="#333" stroke-width="1" opacity="0.6"/>

<!-- ═══════════════════════════════════════ -->
<!-- ALAS IZQUIERDAS                         -->
<!-- ═══════════════════════════════════════ -->

<!-- Estructura base alas -->
<polygon points="215,195 31,185 31,209 215,215" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="215,215 31,209 38,221 215,223" fill="url(#wing_grad2)" opacity="0.7"/>
<polygon points="215,223 60,215 60,237 215,245" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="215,245 60,237 67,249 215,253" fill="url(#wing_grad2)" opacity="0.6"/>
<polygon points="215,253 94,247 94,263 215,267" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="215,267 94,263 100,272 215,274" fill="url(#wing_grad2)" opacity="0.5"/>
<polygon points="215,195 188,234 215,267" fill="#ccc" opacity="0.85"/>
<polygon points="215,195 188,234 215,267" fill="url(#wing_grad)"/>

<!-- Barrido de luz LED sobre ala izquierda -->
<polygon points="215,195 31,185 31,209 215,215" fill="url(#sweep_L)" opacity="0.9"/>
<polygon points="215,223 60,215 60,237 215,245" fill="url(#sweep_L)" opacity="0.8"/>
<polygon points="215,253 94,247 94,263 215,267" fill="url(#sweep_L)" opacity="0.7"/>

<!-- ═══════════════════════════════════════ -->
<!-- ALAS DERECHAS                           -->
<!-- ═══════════════════════════════════════ -->

<polygon points="285,195 469,185 469,209 285,215" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="285,215 469,209 462,221 285,223" fill="url(#wing_grad2)" opacity="0.7"/>
<polygon points="285,223 440,215 440,237 285,245" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="285,245 440,237 433,249 285,253" fill="url(#wing_grad2)" opacity="0.6"/>
<polygon points="285,253 406,247 406,263 285,267" fill="url(#wing_grad)" filter="url(#shadow_soft)"/>
<polygon points="285,267 406,263 400,272 285,274" fill="url(#wing_grad2)" opacity="0.5"/>
<polygon points="285,195 312,234 285,267" fill="#ccc" opacity="0.85"/>
<polygon points="285,195 312,234 285,267" fill="url(#wing_grad)"/>

<!-- Barrido de luz LED sobre ala derecha (espejo) -->
<polygon points="285,195 469,185 469,209 285,215" fill="url(#sweep_R)" opacity="0.9"/>
<polygon points="285,223 440,215 440,237 285,245" fill="url(#sweep_R)" opacity="0.8"/>
<polygon points="285,253 406,247 406,263 285,267" fill="url(#sweep_R)" opacity="0.7"/>

<!-- ═══════════════════════════════════════ -->
<!-- ANILLOS ORBITALES                       -->
<!-- ═══════════════════════════════════════ -->

<!-- Anillo 1 — stroke animado plata oscuro → blanco LED -->
<!-- Anillo 1 — rota sentido horario 360° en 12s + pulso de color -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    from="-25 250 203" to="335 250 203"
    dur="12s" repeatCount="indefinite"/>
  <ellipse cx="250" cy="203" rx="90" ry="30" fill="none" stroke-width="7"
           filter="url(#glow_subtle)">
    <animate attributeName="stroke"
      values="#666666;#aaaaaa;#E8F4FF;#ffffff;#E8F4FF;#aaaaaa;#666666"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
</g>

<!-- Anillo 2 — rota sentido antihorario 360° en 18s + pulso desfasado -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    from="25 250 203" to="-335 250 203"
    dur="18s" repeatCount="indefinite"/>
  <ellipse cx="250" cy="203" rx="90" ry="30" fill="none" stroke-width="7"
           filter="url(#glow_subtle)">
    <animate attributeName="stroke"
      values="#aaaaaa;#666666;#aaaaaa;#E8F4FF;#ffffff;#E8F4FF;#aaaaaa"
      dur="5s" begin="2.5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>
</g>

<!-- ═══════════════════════════════════════ -->
<!-- ESFERA CROMADA                          -->
<!-- ═══════════════════════════════════════ -->

<circle cx="250" cy="196" r="52" fill="url(#sphere_chrome)" filter="url(#shadow_soft)"/>

<!-- Highlight estático -->
<ellipse cx="236" cy="180" rx="18" ry="12" fill="white" opacity="0.35" transform="rotate(-20 236 180)"/>

<!-- LED pulse sobre esfera — azul profundo → blanco LED, cíclico formal -->
<circle cx="250" cy="196" r="52" fill="none" filter="url(#led_glow)">
  <animate attributeName="stroke"
    values="#0A2040;#1A4A7A;#2E6EAA;#E8F4FF;#2E6EAA;#1A4A7A;#0A2040"
    dur="5s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  <animate attributeName="stroke-width"
    values="1;2;4;6;4;2;1"
    dur="5s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  <animate attributeName="opacity"
    values="0.2;0.4;0.7;1;0.7;0.4;0.2"
    dur="5s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
</circle>

<!-- Destello LED blanco en highlight esfera — breve, formal -->
<ellipse cx="238" cy="178" rx="10" ry="6" fill="#E8F4FF" opacity="0" transform="rotate(-20 238 178)" filter="url(#led_glow)">
  <animate attributeName="opacity"
    values="0;0;0.6;0.9;0.6;0;0"
    dur="5s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
</ellipse>

<!-- ═══════════════════════════════════════ -->
<!-- QUILLA / CHEVRONS                       -->
<!-- ═══════════════════════════════════════ -->

<polygon points="250,320 192,270 209,260 250,303" fill="url(#keel_grad)" filter="url(#shadow_soft)"/>
<polygon points="250,320 308,270 291,260 250,303" fill="url(#keel_grad)" filter="url(#shadow_soft)"/>
<polygon points="250,349 192,306 209,297 250,329" fill="url(#keel_grad)" filter="url(#shadow_soft)"/>
<polygon points="250,349 308,306 291,297 250,329" fill="url(#keel_grad)" filter="url(#shadow_soft)"/>
<polygon points="240,299 260,299 253,357 247,357" fill="url(#keel_grad)"/>
<polygon points="247,352 253,352 250,378" fill="#aaa"/>
<polygon points="250,320 192,270 199,280 250,328" fill="#fff" opacity="0.08"/>
<polygon points="250,320 308,270 301,280 250,328" fill="#fff" opacity="0.08"/>

<!-- LED pulse quilla — azul profundo frío, sutil -->
<polygon points="250,320 192,270 209,260 250,303" fill="none" filter="url(#led_glow)">
  <animate attributeName="stroke" values="#0A2040;#1A4A7A;#0A2040" dur="5s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="stroke-width" values="0;2;0" dur="5s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="1s" repeatCount="indefinite"/>
</polygon>
<polygon points="250,320 308,270 291,260 250,303" fill="none" filter="url(#led_glow)">
  <animate attributeName="stroke" values="#0A2040;#1A4A7A;#0A2040" dur="5s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="stroke-width" values="0;2;0" dur="5s" begin="1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="1s" repeatCount="indefinite"/>
</polygon>

<!-- ═══════════════════════════════════════ -->
<!-- TEXTO                                   -->
<!-- ═══════════════════════════════════════ -->

<text x="250" y="420"
      font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="72"
      text-anchor="middle" letter-spacing="6"
      fill="url(#text_grad)" filter="url(#shadow_soft)">OSTP</text>

<!-- Destello LED en texto — blanco frío, breve -->
<text x="250" y="420"
      font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="72"
      text-anchor="middle" letter-spacing="6"
      fill="none" stroke="#E8F4FF" stroke-width="0.8" opacity="0">
  <animate attributeName="opacity"
    values="0;0;0.25;0.4;0.25;0;0"
    dur="6s" repeatCount="indefinite" calcMode="spline"
    keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
  OSTP
</text>

<text x="250" y="455"
      font-family="'Arial',sans-serif"
      font-weight="400" font-size="28"
      text-anchor="middle" letter-spacing="3"
      fill="url(#text_sub_grad)">@echoShift</text>

<!-- ═══════════════════════════════════════ -->
<!-- BORDE FINAL                             -->
<!-- ═══════════════════════════════════════ -->
<circle cx="250" cy="250" r="247" fill="none" stroke="#0a0a0a" stroke-width="3"/>

</svg>
